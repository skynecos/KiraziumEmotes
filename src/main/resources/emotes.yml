# KiraziumEmotes definitions.
# Built-in first test emote uses the verified ModelEngine player_floss blueprint.
# The bundled animation itself is looped; duration-ticks: 0 means it keeps playing
# until the player moves, takes damage, teleports, leaves, dies, or uses /emote stop.

emotes:
  floss:
    display-name: "The Floss"
    renderer: modelengine
    model: player_floss
    animation: dance
    duration-ticks: 0
    lerp-in: 0.10
    lerp-out: 0.10
    speed: 1.0
    cancel-on-move: true
    cancel-on-damage: true
    cancel-on-teleport: true
